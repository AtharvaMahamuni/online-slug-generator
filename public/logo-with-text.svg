<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 48" fill="none" role="img" aria-label="Online Slug Generator">
  <defs>
    <linearGradient id="osg-mark-grad" x1="2" y1="2" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff5e13"/>
      <stop offset="100%" stop-color="#d04200"/>
    </linearGradient>
  </defs>
  <!-- Icon Mark -->
  <g transform="translate(4, 4)">
    <rect width="40" height="40" rx="10" fill="url(#osg-mark-grad)"/>
    <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" stroke="#ffffff" stroke-opacity="0.2" fill="none"/>
    <rect x="6.5" y="14" width="11" height="12" rx="3.5" stroke="#ffffff" stroke-width="2.2" fill="none"/>
    <rect x="22.5" y="14" width="11" height="12" rx="3.5" stroke="#ffffff" stroke-width="2.2" fill="none"/>
    <line x1="15" y1="20" x2="25" y2="20" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <!-- Wordmark Text -->
  <text x="56" y="30" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="19" font-weight="600" fill="#26251e" letter-spacing="-0.3">Online Slug Generator</text>
</svg>
